<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JoqniX Cookie Sync</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>JoqniX Cookie Sync</h1>
      <p>Browser session synchronization</p>
    </header>

    <section class="status-card">
      <div class="status-row">
        <span>Status</span>
        <strong id="status">Checking...</strong>
      </div>

      <div class="status-row">
        <span>Cookies detected</span>
        <strong id="cookie-count">0</strong>
      </div>

      <div class="status-row">
        <span>Last local sync</span>
        <strong id="last-sync">Never</strong>
      </div>
    </section>

    <section class="services">
      <h2>Services</h2>

      <div class="service">
        <span>YouTube</span>
        <span id="youtube-status" class="indicator">Checking</span>
      </div>

      <div class="service">
        <span>Twitch</span>
        <span id="twitch-status" class="indicator">Checking</span>
      </div>

      <div class="service">
        <span>Kick</span>
        <span id="kick-status" class="indicator">Checking</span>
      </div>
    </section>

    <section class="actions">
      <button id="sync-button">
        Sync Locally
      </button>
    </section>

    <p id="message" class="message"></p>

  </main>

  <script src="popup.js"></script>
</body>
</html>
